name: Materialize preview.png

on:
  push:
    paths:
      - preview.png.b64

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode PNG and remove bootstrap files
        run: |
          set -euo pipefail
          base64 -d preview.png.b64 > preview.png
          file preview.png | grep -q 'PNG image'
          rm -f preview.png.b64 .github/workflows/materialize-preview-png.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add raster editor preview"
          git push
