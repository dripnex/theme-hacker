  <text x="342" y="175" fill="#3dff7a" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace">openNote()</text>
  <text x="426" y="176" fill="#7dff9a" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">and then ignored it — the page was the point.</text>
  <rect x="284" y="198" width="640" height="44" rx="6" fill="rgba(61, 255, 122, 0.1)"/>
  <rect x="284" y="198" width="4" height="44" rx="2" fill="#3dff7a"/>
  <text x="302" y="225" fill="rgba(125, 255, 154, 0.5)" font-size="14" font-style="italic" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Keep the session small. One page is enough.</text>
  <circle cx="292" cy="268" r="3" fill="#3dff7a"/>
  <text x="304" y="272" fill="#7dff9a" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">tea first</text>
  <circle cx="292" cy="292" r="3" fill="#3dff7a"/>
  <text x="304" y="296" fill="#7dff9a" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">then the note</text>
  <circle cx="292" cy="316" r="3" fill="#3dff7a"/>
  <text x="304" y="320" fill="#7dff9a" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">then a walk</text>
  <text x="284" y="358" fill="#7dff9a" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">See also</text>
