  <text x="22" y="170" fill="rgba(125, 255, 154, 0.5)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">The light was already on the desk…</text>
  <text x="22" y="216" fill="#7dff9a" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">A walk by the water</text>
  <text x="22" y="234" fill="rgba(125, 255, 154, 0.5)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Harbor air, then the long way home.</text>
  <text x="22" y="280" fill="#7dff9a" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Things I keep</text>
  <text x="22" y="298" fill="rgba(125, 255, 154, 0.5)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">A short list I do not want to lose.</text>
  <text x="22" y="344" fill="#7dff9a" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Tuesday</text>
  <text x="22" y="362" fill="rgba(125, 255, 154, 0.5)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Errands, then the quiet hour.</text>
  <rect x="248" y="42" width="712" height="470" fill="#030805"/>
  <text x="284" y="90" fill="#7dff9a" font-size="28" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Morning pages</text>
  <text x="284" y="114" fill="rgba(125, 255, 154, 0.32)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Today · Markdown</text>
  <text x="284" y="154" fill="#7dff9a" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">The light was already on the desk when I sat down.</text>
  <text x="284" y="176" fill="#7dff9a" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">I wrote</text>
